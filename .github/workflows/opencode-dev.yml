name: opencode-dev

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt for opencode to implement"
        required: true
        type: string
      chat_id:
        description: "Telegram chat ID for the result callback (optional)"
        required: false
        type: string
        default: ""
      user_id:
        description: "Telegram user ID for the result callback (optional)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: opencode-dev
  cancel-in-progress: false

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode
        id: opencode
        uses: anomalyco/opencode/github@v1.19.4
        env:
          ROUTER_KEY: ${{ secrets.ROUTER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: my-agent/combo/code
          use_github_token: true
          prompt: ${{ inputs.prompt }}

      - name: Find dispatch PR
        id: pr
        if: steps.opencode.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_json=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 30 \
            --json number,url,headRefName,createdAt \
            -q '[.[] | select(.headRefName | startswith("opencode/dispatch-"))] | sort_by(.createdAt) | last')
          if [ -z "$pr_json" ] || [ "$pr_json" = "null" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No open opencode/dispatch-* PR was found."
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "number=$(echo "$pr_json" | jq -r .number)" >> "$GITHUB_OUTPUT"
            echo "url=$(echo "$pr_json" | jq -r .url)" >> "$GITHUB_OUTPUT"
            echo "branch=$(echo "$pr_json" | jq -r .headRefName)" >> "$GITHUB_OUTPUT"
          fi

      - name: Path guard
        id: guard
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json files \
            -q '.files[].path' > "$RUNNER_TEMP/pr-files.txt"
          if node scripts/guard-check.mjs "$RUNNER_TEMP/pr-files.txt"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "reason=" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=blocked: PR touches protected paths" >> "$GITHUB_OUTPUT"
            echo "::error::PR touches protected paths; closing the PR and deleting the branch."
            gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --delete-branch \
              --comment "Closed automatically: touches protected paths."
            exit 1
          fi

      - name: Notify Worker
        if: always() && inputs.chat_id != ''
        env:
          DEV_CALLBACK_SECRET: ${{ secrets.DEV_CALLBACK_SECRET }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          CHAT_ID: ${{ inputs.chat_id }}
          USER_ID: ${{ inputs.user_id }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
          PR_FOUND: ${{ steps.pr.outputs.found }}
          GUARD_OK: ${{ steps.guard.outputs.ok }}
          BLOCK_REASON: ${{ steps.guard.outputs.reason }}
          RUN_OK: ${{ steps.opencode.outcome == 'success' && steps.guard.outputs.ok == 'true' }}
        run: |
          node -e '
          const crypto = require("crypto");
          const secret = process.env.DEV_CALLBACK_SECRET || "";
          const base = (process.env.WORKER_URL || "").replace(/\/+$/, "");
          const chatId = process.env.CHAT_ID || "";
          if (!secret || !base || !chatId) {
            console.log("callback skipped: DEV_CALLBACK_SECRET, WORKER_URL or chat_id is missing");
            process.exit(0);
          }
          const found = process.env.PR_FOUND === "true";
          const guardOk = process.env.GUARD_OK === "true";
          const pr = Number(process.env.PR_NUMBER || 0);
          const ok = process.env.RUN_OK === "true" && found && guardOk && pr > 0;
          let reason = "";
          if (!found) reason = "no PR found";
          else if (!guardOk) reason = process.env.BLOCK_REASON || "blocked: guard failed";
          else if (!ok) reason = "run failed or no PR";
          reason = reason.replace(/\s+/g, " ").slice(0, 200);
          const body = JSON.stringify({
            timestamp: Date.now(),
            nonce: crypto.randomBytes(16).toString("hex"),
            ok,
            reason,
            pr: pr > 0 ? pr : null,
            url: process.env.PR_URL || "",
            branch: process.env.PR_BRANCH || "",
            chat_id: chatId,
            user_id: process.env.USER_ID || chatId,
          });
          const signature = crypto.createHmac("sha256", secret).update(body).digest("hex");
          fetch(base + "/dev/callback", {
            method: "POST",
            headers: { "content-type": "application/json", "X-Signature": signature },
            body,
          })
            .then((res) => {
              console.log("callback status:", res.status);
              if (!res.ok) process.exitCode = 1;
            })
            .catch((err) => {
              console.error("callback failed:", err && err.message);
              process.exitCode = 1;
            });
          '
